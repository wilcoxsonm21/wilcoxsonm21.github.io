<!doctype html>
<html lang="en">
<head>
<link rel="stylesheet" href="scene-fonts.css">
<script>
// mirror: with ?scroll the parent page renders every frame (scene-adapter.js), so the page's own
// presentation loop is never scheduled; without it the page works as in the deck (click or arrow keys to step).
window.SCENE_SCROLL = /[?&]scroll\b/.test(location.search);
if (window.SCENE_SCROLL) {
  const raf = window.requestAnimationFrame.bind(window);
  window.requestAnimationFrame = cb => (cb && cb.name === "loop" ? 0 : raf(cb));
  document.documentElement.classList.add("scene-scroll");
}
// start loading the website's face (scene-fonts.css) before the page measures any text (its document.fonts.ready
// then waits for it)
['400 20px "Source Sans 3"', '500 20px "Source Sans 3"', '600 20px "Source Sans 3"', '700 20px "Source Sans 3"',
 'italic 400 20px "Source Sans 3"'].forEach(f => document.fonts.load(f).catch(() => {}));
</script>
<script>
window.SCENE_PORTRAIT = /[?&]portrait\b/.test(location.search);
window.PORTRAIT = null;
if (window.SCENE_PORTRAIT) document.documentElement.classList.add("portrait");
</script>
<script src="portrait/textcond.js"></script>
<script>
if (window.PORTRAIT) document.head.insertAdjacentHTML("beforeend", "<style>#stage{width:" + PORTRAIT.W + "px!important;" +
  "height:" + PORTRAIT.H + "px!important}html.portrait .title,html.portrait #ptitle,html.portrait .callout" +
  "{display:none!important}</style>");
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirror: text-conditioned planning</title>
<style>
:root { --bg: #f5f5f4; --ink: #1c1b1a; --muted: #6e6b67; --rule: #1c1b1a;
        --siT: #3361c4; --supT: #2a7db8; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
body { display: flex; align-items: center; justify-content: center; }
#stage { position: relative; width: 1920px; height: 880px; flex: none; background: var(--bg);
         font-family: "Source Sans 3", "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 400;
         color: var(--ink); overflow: hidden; }
.abs { position: absolute; left: 0; top: 0; }
#fig { width: 1920px; height: 880px; }

/* the qualitative figure: one spawn point, four instructions, four outcomes */
.tile { position: absolute; left: 0; top: 0; border-radius: 16px; background: #1b2233; transform-origin: 50% 50%; }
.tile img { display: block; width: 100%; height: 100%; border-radius: 16px; }
.tile svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; }
.tile.ring { box-shadow: 0 0 0 3px var(--bg), 0 0 0 7px var(--c); }
.pill { position: absolute; left: 0; top: 0; white-space: nowrap; font-style: italic; font-size: 30px; line-height: 1;
        padding: 10px 22px 12px; border-radius: 999px; background: var(--bg); border: 2.5px solid var(--c); }
.label { position: absolute; white-space: nowrap; font-size: 30px; color: var(--muted); }
svg path.line { fill: none; stroke-linecap: round; stroke-linejoin: round; }

/* the chart */
.bar { position: absolute; left: 0; top: 0; }
.bar .seg { position: absolute; left: 0; width: 100%; }
.bar .val { position: absolute; left: -60px; right: -60px; top: -50px; text-align: center; font-size: 38px;
            font-weight: 600; line-height: 1; letter-spacing: -0.01em; }
.mlab { position: absolute; text-align: center; font-size: 24px; line-height: 1.2; white-space: nowrap; }
.mlab b { font-weight: 600; }
.glab { position: absolute; text-align: center; font-size: 26px; font-weight: 600; line-height: 1; white-space: nowrap; }
.rule { position: absolute; background: var(--rule); }
#gain { position: absolute; left: 0; width: 100%; font-size: 26px; font-weight: 700; color: #fff; text-align: center;
        line-height: 1; }
#hud { position: fixed; right: 14px; bottom: 10px; font: 13px/1.3 system-ui, sans-serif; color: #989897; opacity: 0;
       pointer-events: none; }
body.cursor #hud { opacity: 1; }
#lab_spawn { display: none !important; }   /* "spawn point / unseen world" label removed */
</style>
<!-- mirror theme (tools/theme.py) -->
<style>
/* website theme (tools/theme.py): captions in Source Sans 3; a key claim in the page's gold, problems red, plans green */
.title, #ptitle { font-weight: 600 !important; letter-spacing: -0.012em; }
.title b { font-weight: 700; }
.title .blue, .title .violet, .title .teal { background: linear-gradient(90deg, #d49a00, #b98000); -webkit-background-clip: text; background-clip: text;
                                           color: transparent; -webkit-text-fill-color: transparent; }
.title .red { color: #dc4436; }
.title .green { color: #23804d; }
</style>
</head>
<body>
<div id="stage">
  <div class="abs" id="fig">
    <div class="tile" id="spawn" style="width:640px;height:360px">
      <img alt="Spawn point in the unseen Woodland world" src="media/textcond_spawn_point_in_the_unseen_wo.jpg">
      <svg id="spawnsvg" viewBox="0 0 640 360" preserveAspectRatio="none"></svg>
    </div>
    <div class="label" id="lab_spawn" style="text-align:right">spawn point<br>
      <span style="font-size:24px">unseen world</span></div>
    <div class="tile ring" id="tile_swim" style="--c:#3e6fd8"><img alt="Swim" src="media/textcond_swim.jpg"></div>
    <div class="tile ring" id="tile_chop" style="--c:#2e9a5e"><img alt="Chop tree" src="media/textcond_chop_tree.jpg"></div>
    <div class="tile ring" id="tile_dig" style="--c:#8e5bd9"><img alt="Dig ground" src="media/textcond_dig_ground.jpg"></div>
    <div class="tile ring" id="tile_hill" style="--c:#e0a000"><img alt="Ascend hill" src="media/textcond_ascend_hill.jpg"></div>
    <svg class="abs" id="figsvg" width="1920" height="880" viewBox="0 0 1920 880"></svg>
    <div class="pill" id="pill_swim" style="--c:#3e6fd8">&ldquo;Swim&rdquo;</div>
    <div class="pill" id="pill_chop" style="--c:#2e9a5e">&ldquo;Chop tree&rdquo;</div>
    <div class="pill" id="pill_dig" style="--c:#8e5bd9">&ldquo;Dig ground&rdquo;</div>
    <div class="pill" id="pill_hill" style="--c:#e0a000">&ldquo;Ascend hill&rdquo;</div>
  </div>

  <div class="abs" id="chart">
    <div class="rule" id="axis"></div>
    <svg class="abs" id="chartsvg" width="1920" height="880" viewBox="0 0 1920 880"></svg>
    <div class="glab" id="grp_a">No action labels</div>
    <div class="glab" id="grp_b">With action labels</div>
    <div class="rule" id="grp_a_rule"></div>
    <div class="rule" id="grp_b_rule"></div>
    <div class="mlab" id="lab_viper">VIPER</div>
    <div class="mlab" id="lab_rand" style="color:var(--siT)"><b>Mirror</b><br>(random)</div>
    <div class="mlab" id="lab_si" style="color:var(--siT)"><b>Mirror</b><br>(self-improving)</div>
    <div class="mlab" id="lab_bc">BC</div>
    <div class="mlab" id="lab_sup" style="color:var(--supT)"><b>Mirror</b><br>(supervised)</div>
    <div class="label" id="note" style="font-size:24px">Average success across 10 tasks in two unseen worlds</div>
  </div>
</div>
<div id="hud"></div>

<script>
"use strict";
const W = PORTRAIT ? PORTRAIT.W : 1920, H = PORTRAIT ? PORTRAIT.H : 880;
const SPEED = 1.35;   // the intro animation's pace: animations and holds
const PARAMS = new URLSearchParams(location.search);
const RENDER = PARAMS.has("render");
const EMBEDDED = window.top !== window;
const $ = id => document.getElementById(id);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const ns = "http://www.w3.org/2000/svg";
function svgEl(parent, tag, attrs) {
  const e = document.createElementNS(ns, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.append(e);
  return e;
}
const place = (el, l, t, w, h) => Object.assign(el.style, { left: l + "px", top: t + "px", width: w + "px", height: h + "px" });
const BG = "#f5f5f4";

// ---------------------------------------------------------------- figure geometry (figure frame = stage px at scale 1)
// The spawn view opens large and centred, then settles here when the first instruction arrives.
const SPAWN_OPEN = PORTRAIT ? PORTRAIT.SPAWN_OPEN : { cx: 960, cy: 420, w: 820 },
      SPAWN = PORTRAIT ? PORTRAIT.SPAWN : { cx: 960, cy: 250, w: 600 };
SPAWN.h = SPAWN.w * 9 / 16; SPAWN.l = SPAWN.cx - SPAWN.w / 2; SPAWN.t = SPAWN.cy - SPAWN.h / 2;
const K = SPAWN.w / 640;                         // frame px -> figure px, once settled
const TILE_W = PORTRAIT ? PORTRAIT.TILE_W : 390, TILE_H = TILE_W * 9 / 16, TILE_T = 565, GAP = 12, PILL_Y = 485, HEAD = 17;
// target regions in the 640x360 spawn frame: centre x, y and radii (the pool, the tree, the ground, the hill)
const TASKS = PORTRAIT ? PORTRAIT.TASKS : [
  { id: "swim", color: "#3e6fd8", x: 315,  target: [104, 157, 44, 14] },
  { id: "chop", color: "#2e9a5e", x: 745,  target: [178, 141, 27, 47] },
  { id: "dig",  color: "#8e5bd9", x: 1175, target: [330, 262, 70, 24] },
  { id: "hill", color: "#e0a000", x: 1605, target: [522, 136, 96, 46] },
];

const FIG = {};                                   // per task: ellipse, route, arrow tip, lengths
const figsvg = $("figsvg"), spawnsvg = $("spawnsvg");
for (const T of TASKS) {
  const dir = T.up ? -1 : 1, tileT = T.tileT ?? TILE_T;
  place($("tile_" + T.id), T.x - TILE_W / 2, tileT, TILE_W, TILE_H);
  // the target ring lives in the spawn frame's own coordinates, so it rides along with the spawn view
  const [fx, fy, frx, fry] = T.target, u = 1 / K;
  const ed = `M${fx},${fy - fry} A${frx},${fry} 0 1,1 ${fx},${fy + fry} A${frx},${fry} 0 1,1 ${fx},${fy - fry}`;
  const eg = svgEl(spawnsvg, "g", {});
  const eHalo = svgEl(eg, "path", { d: ed, stroke: BG, "stroke-width": 9 * u, opacity: .9, class: "line" });
  const eLine = svgEl(eg, "path", { d: ed, stroke: T.color, "stroke-width": 4 * u, class: "line" });
  // the route: from the bottom of the ring down to the outcome tile, an S-curve that ends vertically
  const sx = SPAWN.l + fx * K, sy = SPAWN.t + (fy + dir * fry) * K + 3 * dir, ex = T.x,
        ey = T.up ? tileT + TILE_H + GAP : tileT - GAP, dy = ey - sy;
  const pd = `M${sx},${sy} C${sx},${sy + dy * .55} ${ex},${ey - dy * .55} ${ex},${ey - dir * HEAD * .8}`;
  const g = svgEl(figsvg, "g", {});
  const pHalo = svgEl(g, "path", { d: pd, stroke: BG, "stroke-width": 10, opacity: .9, class: "line" });
  const pLine = svgEl(g, "path", { d: pd, stroke: T.color, "stroke-width": 4.5, class: "line" });
  const hw = HEAD * .42;
  const tipHalo = svgEl(g, "path", { d: `M${ex},${ey + 3 * dir} L${ex - hw - 3},${ey - dir * (HEAD + 2)} L${ex + hw + 3},${ey - dir * (HEAD + 2)} Z`,
                                     fill: BG, opacity: .9 });
  const tip = svgEl(g, "path", { d: `M${ex},${ey} L${ex - hw},${ey - dir * HEAD} L${ex + hw},${ey - dir * HEAD} Z`, fill: T.color });
  FIG[T.id] = { eHalo, eLine, pHalo, pLine, tip, tipHalo, eL: eLine.getTotalLength(), pL: pLine.getTotalLength() };
}
function drawLen(paths, L, d) {
  for (const p of paths) { p.style.strokeDasharray = `${L} ${L}`; p.style.strokeDashoffset = L * (1 - d); }
}

// ---------------------------------------------------------------- chart geometry (stage px)
const BASE_Y = PORTRAIT ? PORTRAIT.BASE_Y : 650, PCT = PORTRAIT ? PORTRAIT.PCT : 5.2, BAR_W = PORTRAIT ? PORTRAIT.BAR_W : 96;      // 100% = 520 px
const BARS = PORTRAIT ? PORTRAIT.BARS : { viper: { x: 1040, v: 2 }, rand: { x: 1210, v: 42 }, si: { x: 1380, v: 64 },
               bc: { x: 1570, v: 3 }, sup: { x: 1740, v: 71 } };
const BAR_STYLE = { viper: ["#c8c7c6", "#1c1b1a"], rand: ["#b9ccf3", "#3361c4"], si: ["#3e6fd8", "#3361c4"],
                    bc: ["#c8c7c6", "#1c1b1a"], sup: ["#4aa3e0", "#2a7db8"] };
for (const id in BARS) {
  const b = BARS[id], el = document.createElement("div");
  el.className = "bar"; el.id = "bar_" + id;
  el.style.width = BAR_W + "px";
  const [fill, ink] = BAR_STYLE[id];
  // the self-improving bar is the random-walk V2A model's 42% plus what self-improvement adds on top
  const lo = document.createElement("div"); lo.className = "seg";
  lo.style.background = id === "si" ? BAR_STYLE.rand[0] : fill;
  el.append(lo);
  let hi = null;
  if (id === "si") {
    hi = document.createElement("div"); hi.className = "seg"; hi.style.background = fill;
    hi.style.borderRadius = "8px 8px 0 0"; el.append(hi);
    const gain = document.createElement("div"); gain.id = "gain"; gain.textContent = "+22"; el.append(gain);
  }
  const val = document.createElement("div"); val.className = "val"; val.style.color = ink;
  el.append(val);
  $("chart").append(el);
  Object.assign(b, { el, lo, hi, val });
  Object.assign($("lab_" + id).style, { left: (b.x - 150) + "px", width: "300px", top: (BASE_Y + 14) + "px" });
}
place($("axis"), ...(PORTRAIT ? PORTRAIT.AXIS : [975, BASE_Y, 815, 2]));
// the two groups: headers with a rule under them, split by a dashed line
const GA = [BARS.viper.x - BAR_W / 2, BARS.si.x + BAR_W / 2], GB = [BARS.bc.x - BAR_W / 2, BARS.sup.x + BAR_W / 2];
const GROUP_Y = PORTRAIT ? PORTRAIT.GROUP_Y : 110;
for (const [id, [a, b]] of [["grp_a", GA], ["grp_b", GB]]) {
  Object.assign($(id).style, { left: (a - 40) + "px", width: (b - a + 80) + "px", top: GROUP_Y + "px" });
  place($(id + "_rule"), a, GROUP_Y + 40, b - a, 1.5);
}
const DIV_X = (GA[1] + GB[0]) / 2;
svgEl($("chartsvg"), "path", { d: `M${DIV_X},${GROUP_Y + 4} L${DIV_X},${BASE_Y - 6}`, stroke: "#bebdbc",
                               "stroke-width": 2, "stroke-dasharray": "6 8", id: "divider" });
Object.assign($("note").style, { left: GA[0] + "px", top: (BASE_Y + 112) + "px" });

// ---------------------------------------------------------------- timeline helpers (as in the intro animation)
const E = {
  lin: u => u,
  io: u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2,
  out: u => 1 - Math.pow(1 - u, 3),
  in2: u => u * u,
  back: u => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); },
};
const fade = (id, to, at = 0, dur = .5, ease = "io") => [id, "o", to, at, dur, ease];
const move = (id, prop, to, at, dur, ease = "io") => [id, prop, to, at, dur, ease];
const set = (id, prop, to, at = 0) => [id, prop, to, at, .01, "lin"];

// one instruction: its target lights up, the route draws out to the outcome, the outcome pops in
function instruction(t, at) {
  return [set("el_" + t, "o", 1, at), move("el_" + t, "draw", 1, at, .55),
          fade("pill_" + t, 1, at + .15, .45), move("pill_" + t, "dy", 0, at + .15, .55, "out"),
          set("p_" + t, "o", 1, at + .45), move("p_" + t, "draw", 1, at + .45, .75),
          fade("tile_" + t, 1, at + 1.05, .3), move("tile_" + t, "s", 1, at + 1.05, .6, "back")];
}
// the figure steps aside for the chart: its centre (960, 433) goes to (cx, cy) at scale gs
const FIG_SIDE = PORTRAIT ? PORTRAIT.FIG_SIDE : { gs: .46, cx: 500, cy: 430, ox: 960, oy: 433 };
const STEPS = [
  { name: "spawn", hold: .8, tw: [] },
  // the camera pulls back from the spawn view as the first instruction arrives
  { name: "chop", hold: 3.2,
    tw: [move("spawn", "cy", SPAWN.cy, 0, .9), move("spawn", "w", SPAWN.w, 0, .9), ...instruction("chop", .75)] },
  { name: "others", hold: 3.2, tw: [...instruction("swim", 0), ...instruction("dig", .3), ...instruction("hill", .6)] },
  { name: "baselines", hold: 3.0,
    tw: [move("fig", "gs", FIG_SIDE.gs, 0, 1.2), move("fig", "fx", FIG_SIDE.cx - FIG_SIDE.ox * FIG_SIDE.gs, 0, 1.2),
         move("fig", "fy", FIG_SIDE.cy - FIG_SIDE.oy * FIG_SIDE.gs, 0, 1.2), fade("fig", .6, .2, 1.0),
         fade("axis", 1, .6, .5), fade("divider", 1, .7, .5), fade("grp_a", 1, .8, .5), fade("grp_b", 1, .8, .5),
         fade("note", 1, .9, .5), fade("lab_viper", 1, .9, .5), fade("lab_bc", 1, .9, .5),
         fade("lab_rand", .3, .9, .5), fade("lab_si", .3, .9, .5), fade("lab_sup", .3, .9, .5),
         set("bar_viper", "o", 1, 1.3), move("bar_viper", "v", 2, 1.3, .8, "out"),
         set("bar_bc", "o", 1, 1.4), move("bar_bc", "v", 3, 1.4, .8, "out")] },
  { name: "random", hold: 2.2,
    tw: [fade("lab_rand", 1, 0, .4), set("bar_rand", "o", 1, .1), move("bar_rand", "v", 42, .1, 1.0, "out")] },
  // a copy of the random-walk V2A model's bar slides over and self-improves
  { name: "self", hold: 3.4,
    tw: [set("bar_si", "dx", BARS.rand.x - BARS.si.x), set("bar_si", "v", 42), set("bar_si", "o", 1),
         set("bar_si", "lab", 0), move("bar_si", "dx", 0, .1, .8), fade("lab_si", 1, .5, .5),
         move("bar_si", "lab", 1, .75, .3), move("bar_si", "v", 64, 1.0, 1.1, "out"), fade("gain", 1, 1.7, .4)] },
  { name: "supervised", hold: 2.6,
    tw: [fade("lab_sup", 1, 0, .4), set("bar_sup", "o", 1, .1), move("bar_sup", "v", 71, .1, 1.1, "out")] },
];

// Fused clicks: a chained beat hands over to the next one halfway through and keeps playing underneath it.
// The opening (spawn view, "Chop tree", the other instructions) plays by itself when the slide opens.
const CHAIN = new Set(["spawn", "chop"].map(n => STEPS.findIndex(st => st.name === n)));
const chainEnd = k => { while (CHAIN.has(k)) k++; return k; };
const STOPS = [0];   // click s of the slide starts beat STOPS[s] and ends on chainEnd(STOPS[s])
for (let k = 1; k < STEPS.length; k++) if (!CHAIN.has(k - 1)) STOPS.push(k);

// ---------------------------------------------------------------- state
const INIT = { fig: { o: 1, gs: 1, fx: 0, fy: 0 }, spawn: { o: 1, cy: SPAWN_OPEN.cy, w: SPAWN_OPEN.w },
               lab_spawn: { o: 1 } };
for (const T of TASKS) { INIT["pill_" + T.id] = { dy: 12 }; INIT["tile_" + T.id] = { s: .8 }; }
const ALL_IDS = new Set([...Object.keys(INIT), "gain", "divider", "axis", "note", "grp_a", "grp_b"]);
for (const T of TASKS) for (const p of ["el_", "p_", "pill_", "tile_"]) ALL_IDS.add(p + T.id);
for (const id in BARS) { ALL_IDS.add("bar_" + id); ALL_IDS.add("lab_" + id); }
for (const st of STEPS) for (const t of st.tw) ALL_IDS.add(t[0]);
function fresh() {
  const st = {};
  for (const id of ALL_IDS) st[id] = Object.assign({ o: 0, s: 1, dx: 0, dy: 0, draw: 0, v: 0, lab: 1 }, INIT[id] || {});
  return st;
}
// Each beat keeps its own clock (BT: start times of beats played in this run), so a chained beat
// that starts before the previous one ends lets that one finish instead of snapping it to its end.
let BT = [];
const tauOf = (i, k, tau) => i === k ? tau : BT[i] != null ? (performance.now() - BT[i]) / 1000 * SPEED : 1e9;
function stateAt(k, tau) {
  const st = fresh();
  for (let i = 0; i <= k; i++) {
    for (const [id, prop, to, at, dur, ease] of STEPS[i].tw) {
      const ti = tauOf(i, k, tau);
      if (ti < at) continue;
      const u = clamp((ti - at) / Math.max(dur, 1e-6), 0, 1);
      st[id][prop] = st[id][prop] + (to - st[id][prop]) * E[ease](u);
    }
  }
  return st;
}
function vis(n, o) { n.style.opacity = o; n.style.visibility = o < .002 ? "hidden" : "visible"; }
function apply(st) {
  // the figure as a whole: zoom, not scale(), so its text stays sharp while it moves
  const F = st.fig, fig = $("fig");
  vis(fig, F.o);
  fig.style.zoom = F.gs;
  fig.style.transform = `translate(${F.fx / F.gs}px,${F.fy / F.gs}px)`;
  // the spawn view (drawn at its native 640x360 and zoomed), with the label beside it
  const S = st.spawn, sz = S.w / 640, sl = SPAWN.cx - S.w / 2, stp = S.cy - S.w * 9 / 32;
  const spawn = $("spawn");
  vis(spawn, S.o);
  spawn.style.zoom = sz;
  spawn.style.transform = `translate(${sl / sz}px,${stp / sz}px)`;
  const lab = $("lab_spawn");
  vis(lab, st.lab_spawn.o);
  Object.assign(lab.style, { right: (W - sl + 26) + "px", top: (S.cy - 40) + "px" });
  for (const T of TASKS) {
    const f = FIG[T.id], e = st["el_" + T.id], p = st["p_" + T.id];
    for (const n of [f.eHalo, f.eLine]) vis(n, e.o);
    drawLen([f.eHalo, f.eLine], f.eL, e.draw);
    for (const n of [f.pHalo, f.pLine]) vis(n, p.o);
    drawLen([f.pHalo, f.pLine], f.pL, p.draw);
    const tipO = p.o * clamp((p.draw - .82) / .18, 0, 1);
    vis(f.tip, tipO); vis(f.tipHalo, tipO * .9);
    const pill = $("pill_" + T.id), ps = st["pill_" + T.id];
    vis(pill, ps.o);
    pill.style.transform = `translate(${T.x}px,${(T.pillY ?? PILL_Y) + ps.dy}px) translate(-50%,-50%)`;
    const tile = $("tile_" + T.id), ts = st["tile_" + T.id];
    vis(tile, ts.o);
    tile.style.transform = `scale(${ts.s})`;
  }
  // the chart
  for (const id of ["axis", "divider", "grp_a", "grp_b", "note"]) vis($(id), st[id].o);
  vis($("grp_a_rule"), st.grp_a.o); vis($("grp_b_rule"), st.grp_b.o);
  for (const id in BARS) {
    const b = BARS[id], s = st["bar_" + id];
    vis(b.el, s.o);
    vis($("lab_" + id), st["lab_" + id].o);
    if (s.o < .002) continue;
    const h = s.v * PCT;
    Object.assign(b.el.style, { left: (b.x - BAR_W / 2 + s.dx) + "px", top: (BASE_Y - h) + "px", height: h + "px" });
    if (b.hi) {
      const lo = Math.min(s.v, BARS.rand.v) * PCT, hi = Math.max(0, s.v - BARS.rand.v) * PCT;
      Object.assign(b.lo.style, { top: hi + "px", height: lo + "px", borderRadius: hi > .5 ? "0" : "8px 8px 0 0" });
      Object.assign(b.hi.style, { top: "0px", height: hi + "px" });
      vis($("gain"), st.gain.o);
      $("gain").style.top = (hi / 2 - 13) + "px";
    } else {
      Object.assign(b.lo.style, { top: "0px", height: h + "px", borderRadius: "8px 8px 0 0" });
    }
    b.val.textContent = Math.round(s.v) + "%";
    vis(b.val, s.lab);
  }
}

// ---------------------------------------------------------------- presentation mode
let K0 = 0, T0 = performance.now(), INSTANT = false;
function go(k, instant = false) {
  K0 = clamp(k, 0, STEPS.length - 1);
  T0 = performance.now();
  INSTANT = instant;
  if (instant) BT = []; else BT[K0] = T0;
  $("hud").textContent = `${K0} / ${STEPS.length - 1}  ${STEPS[K0].name}`;
}
function loop() {
  const tau = INSTANT ? 1e9 : (performance.now() - T0) / 1000 * SPEED;
  apply(stateAt(K0, tau));
  // the opening spawn view hands over at once: the poster already shows it while the page loads
  if (!INSTANT && CHAIN.has(K0) && tau >= (STEPS[K0].name === "spawn" ? 0 : Math.max(1.0, STEPS[K0].hold * .5))) go(K0 + 1);
  requestAnimationFrame(loop);
}
function fit() { $("stage").style.zoom = Math.min(innerWidth / W, innerHeight / H); }

// ---------------------------------------------------------------- render mode (frame-accurate screenshots / mp4)
const STARTS = [];
{ let t = 0; for (const s of STEPS) { STARTS.push(t); t += s.hold / SPEED; } STARTS.push(t); }
window.TOTAL = STARTS[STARTS.length - 1];
window.STEP_TABLE = STEPS.map((st, i) => [st.name, STARTS[i], st.hold]);
window.renderAt = function (T) {
  let k = 0;
  while (k < STEPS.length - 1 && T >= STARTS[k + 1]) k++;
  apply(stateAt(k, (T - STARTS[k]) * SPEED));
};
window.showStep = k => apply(stateAt(k, 1e9));

const loaded = Promise.all([document.fonts.ready, ...[...document.images].map(im => im.decode().catch(() => {}))]);
if (window.deckwerk && window.deckwerk.ready) window.deckwerk.ready(loaded);
if (RENDER) {
  window.READY = false;
  loaded.then(() => { window.renderAt(0); window.READY = true; });
} else {
  apply(stateAt(0, 1e9));
  fit();
  addEventListener("resize", fit);
  if (!EMBEDDED) {
    addEventListener("keydown", e => {
      const k = e.key;
      if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(k)) { go(K0 + 1); e.preventDefault(); }
      else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(k)) { go(chainEnd(STOPS.filter(b => chainEnd(b) < K0).pop() ?? 0), true); e.preventDefault(); }
      else if (k === "r" || k === "R") go(K0);
      else if (k === "Home") go(0, true);
      else if (k === "End") go(STEPS.length - 1, true);
    });
    addEventListener("click", () => go(K0 + 1));
    let hideT = null;
    addEventListener("mousemove", () => {
      document.body.classList.add("cursor");
      clearTimeout(hideT);
      hideT = setTimeout(() => document.body.classList.remove("cursor"), 1500);
    });
  }
  // In a DeckWerk web element the slide owns the clicker: build step s of the slide is beat s here.
  // Stepping forward by one plays that beat; any other jump (back, or entering mid-slide) lands on it settled.
  // DeckWerk re-sends the current step/active notice whenever it re-renders the slide; acting on a repeat
  // would snap the running beat to its end, so only a change of step does anything.
  let started = false, pendingStep = null, lastStep = null;
  // Build steps map onto STOPS; opening the slide (step 0) plays the opening beats.
  const toStep = (s, animate, entering = false) => {
    const b = STOPS[Math.min(s, STOPS.length - 1)];
    if (!started) { pendingStep = s; return; }
    if (!entering && s === lastStep) return;
    lastStep = s;
    if (s === 0 && entering) go(0);
    else if (animate && b === chainEnd(STOPS[Math.max(s - 1, 0)]) + 1 && K0 < b) go(b);
    else go(chainEnd(b), true);
  };
  if (EMBEDDED && window.deckwerk) {
    // play the opening only on arriving at the slide, not on every repeated "active" notice
    let slideActive = false;
    window.deckwerk.onActive(({ step }) => { const entering = !slideActive; slideActive = true; toStep(step || 0, false, entering); });
    window.deckwerk.onInactive(() => { slideActive = false; lastStep = null; });
    window.deckwerk.onStep(({ step }) => toStep(step || 0, true));
  }
  loaded.then(() => {
    started = true;
    if (EMBEDDED) { lastStep = pendingStep || 0; if (pendingStep) go(chainEnd(STOPS[Math.min(pendingStep, STOPS.length - 1)]), true); else go(0); }
    else go(parseInt(PARAMS.get("step") || "0", 10) || 0, true);
    loop();
  });
}
</script>
