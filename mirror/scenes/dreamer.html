<script>
// mirror: with ?scroll the parent page renders every frame (scene-adapter.js), so the page's own
// presentation loop is never scheduled; without it the page works as in the deck (click or arrow keys to step).
window.SCENE_SCROLL = /[?&]scroll\b/.test(location.search);
if (window.SCENE_SCROLL) {
  const raf = window.requestAnimationFrame.bind(window);
  window.requestAnimationFrame = cb => (cb && cb.name === "loop" ? 0 : raf(cb));
  document.documentElement.classList.add("scene-scroll");
}
// start loading the website's face (scene-fonts.css) before the page measures any text (its document.fonts.ready
// then waits for it)

 'italic 400 20px "Source Sans 3"'].forEach(f => document.fonts.load(f).catch(() => {}));
</script>

<script>
"use strict";
const META = {"methods": ["VPT BC", "Modern BC", "VLA (Gemma 3)", "Modern BC + WM", "Dreamer V4", "Mirror (supervised)", "PPO", "Rainbow", "IMPALA", "Dreamer V3", "Mirror (self-improving)", "Mirror + Oracle VP"], "wave": {"0": 1, "1": 1, "2": 1, "3": 1, "4": 1, "5": 2, "6": 3, "7": 3, "8": 3, "9": 3, "10": 4, "11": 5}, "panels": [6, 6], "markers": [3, 4, 6, 7, 8, 9]};
const W = PORTRAIT ? PORTRAIT.W : 1920, H = PORTRAIT ? PORTRAIT.H : 1080;
const SPEED = 1.0;
const PARAMS = new URLSearchParams(location.search);
const RENDER = PARAMS.has("render");
const EMBEDDED = window.top !== window;
const $ = id => document.getElementById(id);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
if (PARAMS.has("title")) $("ptitle").style.visibility = "visible";
// portrait (scenes/portrait/dreamer.js): the figure's panels, icons and legend move into the tall stage's layout
if (PORTRAIT) PORTRAIT.arrange();

// ---------------------------------------------------------------- timeline helpers
const E = {
  lin: u => u,
  io: u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2,
  out: u => 1 - Math.pow(1 - u, 3),
};
const fade = (id, to, at = 0, dur = .45, ease = "io") => [id, "o", to, at, dur, ease];
const move = (id, prop, to, at, dur, ease = "io") => [id, prop, to, at, dur, ease];

// one beat = the methods of one old build layer. Their legend entries fade in; their bars grow in a wave
// that runs left to right (bars within a milestone, then across milestones, the lower row a little later);
// each value fades in as its bar lands.
const BEAT_METHODS = [[], [], [], [], [], []];
for (const m in META.wave) BEAT_METHODS[META.wave[m]].push(+m);
function wave(methods, at, { methodGap = .09, colGap = .055, rowGap = .09, grow = .7 } = {}) {
  const tw = [];
  let end = at;
  methods.forEach((m, mi) => {
    const t0 = at + mi * methodGap;
    tw.push(fade(`sw-m${m}`, 1, t0, .4), fade(`leg-m${m}`, 1, t0, .4));
    if (META.markers.includes(m)) tw.push(fade(`mk-m${m}`, 1, t0, .4));
    META.panels.forEach((n, r) => {
      for (let p = 0; p < n; p++) {
        const t = t0 + .1 + (PORTRAIT ? PORTRAIT.lag(r, p, colGap, rowGap) : p * colGap + r * rowGap);
        tw.push(move(`bar-m${m}-r${r}-p${p}`, "g", 1, t, grow, "out"),
                fade(`lbl-m${m}-r${r}-p${p}`, 1, t + grow * .55, .3, "lin"));
        end = Math.max(end, t + grow * .55 + .3);
      }
    });
  });
  return { tw, end };
}
const W1 = wave(BEAT_METHODS[1], .1), W2 = wave(BEAT_METHODS[2], .05), W3 = wave(BEAT_METHODS[3], .1);
const W4 = wave(BEAT_METHODS[4], .05), W5 = wave(BEAT_METHODS[5], .05);
const STEPS = [
  // panels, milestones, axis labels and footnote
  { name: "base", hold: 1.2, tw: [] },
  // offline baselines (+ the Offline legend heading)
  { name: "offline", hold: W1.end + 1.2, tw: [fade("head-offline", 1, 0, .45), fade("desc-offline", 1, .05, .45), ...W1.tw] },
  // Mirror (supervised) + its callout
  { name: "mirror", hold: W2.end + 1.6, tw: [...W2.tw, fade("c1", 1, .35, .5)] },
  // online baselines (+ the Online legend heading); the callout stays
  { name: "online", hold: W3.end + 1.2, tw: [fade("head-online", 1, 0, .45), fade("desc-online", 1, .05, .45), ...W3.tw] },
  // Mirror (self-improving); the callouts cross-fade
  { name: "self", hold: W4.end + 1.6, tw: [...W4.tw, fade("c1", 0, 0, .3), fade("c2", 1, .25, .5)] },
  // Mirror + Oracle VP
  { name: "oracle", hold: W5.end + 1.8, tw: [...W5.tw, fade("c2", 0, 0, .3), fade("c3", 1, .25, .5), move("ring", "g", 1, 1.0, .7)] },
];

// ---------------------------------------------------------------- state
const ALL_IDS = new Set();
for (const st of STEPS) for (const t of st.tw) ALL_IDS.add(t[0]);
const NODES = {};
for (const id of ALL_IDS) { NODES[id] = $(id); if (!NODES[id]) console.error("missing node", id); }
function stateAt(k, tau) {
  const st = {};
  for (const id of ALL_IDS) st[id] = { o: 0, g: 0 };
  for (let i = 0; i <= k; i++) {
    for (const [id, prop, to, at, dur, ease] of STEPS[i].tw) {
      if (i === k && tau < at) continue;
      const u = i < k ? 1 : clamp((tau - at) / Math.max(dur, 1e-6), 0, 1);
      st[id][prop] = st[id][prop] + (to - st[id][prop]) * E[ease](u);
    }
  }
  return st;
}
let LIVE = false;
function apply(st) {
  if (!LIVE) { LIVE = true; $("stage").classList.add("live"); }
  for (const id of ALL_IDS) {
    const n = NODES[id], p = st[id];
    if (!n) continue;
    if (id === "ring") {
      n.style.visibility = p.g > .001 ? "visible" : "hidden";
      n.style.strokeDashoffset = 1 - p.g;
    } else if (id.startsWith("bar-")) {
      n.style.visibility = p.g > .001 ? "visible" : "hidden";
      n.style.transform = `scaleY(${p.g})`;
    } else {
      n.style.opacity = p.o;
      n.style.visibility = p.o < .002 ? "hidden" : "visible";
    }
  }
  if (PORTRAIT) PORTRAIT.update(st);   // portrait: the chart stays centred while the legend blocks arrive
}

// ---------------------------------------------------------------- presentation mode
let K = 0, T0 = performance.now(), INSTANT = false;
function go(k, instant = false) {
  K = clamp(k, 0, STEPS.length - 1);
  T0 = performance.now();
  INSTANT = instant;
  if (!EMBEDDED) try { localStorage.setItem("dreamer_step", String(K)); } catch (e) {}
}
function loop() {
  const tau = INSTANT ? 1e9 : (performance.now() - T0) / 1000 * SPEED;
  apply(stateAt(K, tau));
  requestAnimationFrame(loop);
}
function fit() { $("stage").style.zoom = Math.min(innerWidth / W, innerHeight / H); }

// ---------------------------------------------------------------- render mode (frame checks)
const STARTS = [];
{ let t = 0; for (const s of STEPS) { STARTS.push(t); t += s.hold / SPEED; } STARTS.push(t); }
window.SPEED = SPEED;
window.TOTAL = STARTS[STARTS.length - 1];
window.STEP_TABLE = STEPS.map((st, i) => [st.name, STARTS[i], st.hold / SPEED]);
window.renderStep = (k, tau) => apply(stateAt(k, tau));
window.renderAt = function (T) {
  let k = 0;
  while (k < STEPS.length - 1 && T >= STARTS[k + 1]) k++;
  apply(stateAt(k, (T - STARTS[k]) * SPEED));
};

if (RENDER) {
  window.READY = false;
  document.fonts.ready.then(() => { window.renderStep(0, 0); window.READY = true; });
} else {
  fit();
  addEventListener("resize", fit);
  if (!EMBEDDED) {
    addEventListener("keydown", e => {
      const k = e.key;
      if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(k)) { go(K + 1); e.preventDefault(); }
      else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(k)) { go(K - 1, true); e.preventDefault(); }
      else if (k === "r" || k === "R") go(K);
      else if (k === "Home") go(0, true);
      else if (k === "End") go(STEPS.length - 1, true);
    });
    addEventListener("click", () => go(K + 1));
  }
  // In a DeckWerk web element the slide owns the clicker: build step s of the slide is beat s here.
  // Stepping forward by one plays that beat; any other jump (back, or entering mid-slide) lands on it settled.
  // DeckWerk re-sends the current step/active notice whenever it re-renders the slide; acting on a repeat
  // would snap the running beat to its end, so only a change of step does anything.
  let started = false, pendingStep = null, lastStep = null, slideActive = false;
  const toStep = (s, animate) => {
    if (!started) { pendingStep = s; return; }
    if (s === lastStep) return;
    lastStep = s;
    if (animate && s === K + 1) go(s); else go(s, true);
  };
  if (EMBEDDED && window.deckwerk) {
    window.deckwerk.onActive(({ step }) => { if (!slideActive) { slideActive = true; lastStep = null; } toStep(step || 0, false); });
    window.deckwerk.onInactive(() => { slideActive = false; });
    window.deckwerk.onStep(({ step }) => toStep(step || 0, true));
  }
  const boot = document.fonts.ready.then(() => {
    let k0 = 0;
    if (!EMBEDDED) try { k0 = parseInt(localStorage.getItem("dreamer_step") || "0", 10) || 0; } catch (e) {}
    started = true;
    lastStep = pendingStep; go(pendingStep ?? k0, true); loop();
  });
  if (window.deckwerk && window.deckwerk.ready) window.deckwerk.ready(boot);
}
</script>
