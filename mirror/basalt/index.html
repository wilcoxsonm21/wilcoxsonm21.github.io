<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mirror: MineRL BASALT Episodes</title>
  <meta name="description" content="Every MineRL BASALT evaluation episode of Mirror, supervised and self-improving, on the same 11 worlds.">
  <meta name="theme-color" content="#0f0e0d">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/theme.css?v=20261016f">
  <link rel="stylesheet" href="../css/site.css?v=20261016f">
  <link rel="stylesheet" href="../css/watch.css?v=20261016f">
  <script src="../js/embed.js?v=20261016f"></script>
  <script src="../js/turn.js?v=20261016f"></script>
</head>

<body>
  <nav class="localnav" aria-label="Sections">
    <div class="localnav-inner">
      <a class="localnav-mark" href="../">Mirror</a>
      <div class="localnav-links"><a href="../#basalt">BASALT</a></div>
      <a class="pill pill-dark localnav-cta" href="#">Paper</a>
    </div>
  </nav>

  <main class="w cinema">
    <!-- all episodes -->
    <div class="w-list" id="list">
      <header class="cinema-head">
        <p class="eyebrow">MineRL BASALT</p>
        <h1>All 44 <span class="mk">evaluation episodes</span></h1>
      </header>
      <div class="segmented" id="tabs" role="tablist" aria-label="Task">
        <button role="tab" type="button" data-tab="findcave" aria-selected="true">FindCave</button>
        <button role="tab" type="button" data-tab="waterfall" aria-selected="false">MakeWaterfall</button>
      </div>
      <p class="w-note" id="note"></p>
      <div id="sections"></div>
    </div>

    <!-- one episode -->
    <section class="w-episode" id="episode" aria-labelledby="ep-title" tabindex="-1" hidden>
      <div class="w-topbar">
        <button class="w-back" id="back" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>All episodes</button>
        <div class="w-steps">
          <button class="w-round" id="ep-prev" type="button" aria-label="Previous world"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg></button>
          <button class="w-round" id="ep-next" type="button" aria-label="Next world"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg></button>
        </div>
      </div>
      <header class="cinema-head">
        <p class="eyebrow" id="ep-eyebrow"></p>
        <h2 id="ep-title"></h2>
      </header>
      <div class="segmented" id="models" role="tablist" aria-label="Model"></div>
      <figure id="player"></figure>
    </section>
  </main>

  <script src="../js/watch-player.js?v=20261016f"></script>
  <script src="watch.js?v=20261016f"></script>
</body>

</html>
