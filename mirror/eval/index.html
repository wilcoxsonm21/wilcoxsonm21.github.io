<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mirror: MineRL Diamond Challenge Episodes</title>
  <meta name="description" content="Every MineRL Diamond Challenge evaluation episode of Mirror: watch the agent beside its video plan.">
  <meta name="theme-color" content="#0f0e0d">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/theme.css?v=20261017j">
  <link rel="stylesheet" href="../css/site.css?v=20261017j">
  <link rel="stylesheet" href="../css/watch.css?v=20261017j">
  <script src="../js/embed.js?v=20261017j"></script>
  <script src="../js/turn.js?v=20261017j"></script>
</head>

<body>
  <nav class="localnav" aria-label="Sections">
    <div class="localnav-inner">
      <a class="localnav-mark" href="../">Mirror</a>
      <div class="localnav-links"><a href="../#survival">Survival mode</a></div>
      <a class="pill pill-dark localnav-cta" href="#">Paper</a>
    </div>
  </nav>

  <main class="w cinema">
    <!-- all episodes -->
    <div class="w-list" id="list">
      <header class="cinema-head">
        <p class="eyebrow">MineRL Diamond Challenge</p>
        <h1>All 384 <span class="mk">evaluation episodes</span></h1>
      </header>
      <div class="segmented" id="tabs" role="tablist" aria-label="Setting">
        <button role="tab" type="button" data-tab="online" aria-selected="true">Online<span class="seg-sep"> &middot; </span><span class="seg-sub">generated plans</span></button>
        <button role="tab" type="button" data-tab="oracle" aria-selected="false">Online<span class="seg-sep"> &middot; </span><span class="seg-sub">oracle plans</span></button>
        <button role="tab" type="button" data-tab="offline" aria-selected="false">Offline<span class="seg-sep"> &middot; </span><span class="seg-sub">generated plans</span></button>
      </div>
      <p class="w-note" id="note"></p>
      <section class="w-section" aria-labelledby="count">
        <div class="w-section-head"><h3 id="count"></h3><span id="count-sub"></span></div>
        <ul class="w-grid" id="grid"></ul>
      </section>
    </div>

    <!-- one episode -->
    <section class="w-episode" id="episode" aria-labelledby="ep-title" tabindex="-1" hidden>
      <div class="w-topbar">
        <button class="w-back" id="back" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>All episodes</button>
        <div class="w-steps">
          <button class="w-round" id="ep-prev" type="button" aria-label="Previous episode"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg></button>
          <button class="w-round" id="ep-next" type="button" aria-label="Next episode"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg></button>
        </div>
      </div>
      <header class="cinema-head">
        <p class="eyebrow" id="ep-eyebrow"></p>
        <h2 id="ep-title"></h2>
      </header>
      <figure id="player"></figure>
    </section>
  </main>

  <script src="../js/watch-player.js?v=20261017j"></script>
  <script src="watch.js?v=20261017j"></script>
</body>

</html>
